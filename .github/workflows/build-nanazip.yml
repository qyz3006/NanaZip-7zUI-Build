name: Build NanaZip Modern (Mica Guard) Portable x64

# Build NanaZip Modern with Mica guard patch for Win10 compatibility.
#
# Root cause: Mile.Xaml's WM_CREATE handler calls
# MileSetWindowSystemBackdropTypeAttribute(MICA) unconditionally.
# Mica is Win11-only; on Win10 it corrupts the XAML framework stack,
# causing white screen + delayed __fastfail 0xC0000409 crash.
#
# Fix: Guard the Mica call behind a Win11 version check (VerifyVersionInfoW).
# The patched Mile.Xaml.cpp source is in qyz3006/Mile.Xaml fork.
# Mile.Xaml NuGet package uses source injection (targets file adds
# Mile.Xaml.cpp to the consuming project's ClCompile list), so we
# replace the source file in the NuGet cache before building.
#
# Also applies a try/catch around MileXamlGlobalInitialize() in App.cpp
# as defense-in-depth for CoreWindow::GetForCurrentThread() returning
# null on some Win10 configurations.

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build-nanazip.yml'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1

    steps:
      - name: Checkout this workflow repo
        uses: actions/checkout@v6

      - name: Clone NanaZip source (with submodules)
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 30
          git config --global https.lowSpeedLimit 1000
          git config --global https.lowSpeedTime 30
          timeout 600 git clone --depth 1 https://github.com/M2Team/NanaZip.git NanaZipSrc
          cd NanaZipSrc
          timeout 900 git submodule update --init --recursive --depth 1
          echo "=== NanaZipSrc top level ==="
          ls -la

      - name: Clone Mile.Xaml fork (Mica patch source)
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          timeout 300 git clone --depth 1 https://github.com/qyz3006/Mile.Xaml.git MileXamlFork
          echo "=== MileXamlFork Mica patch verification ==="
          grep -c "WIN10 CRASH FIX" MileXamlFork/Mile.Xaml.Native/Mile.Xaml.cpp || { echo "ERROR: Mica patch not found in fork"; exit 1; }
          echo "Mica patch confirmed in fork"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      # ------------------------------------------------------------------
      # Step 1: Restore NuGet packages for the solution.
      # This downloads Mile.Xaml 2.5.1616 (among others) to the NuGet cache.
      # ------------------------------------------------------------------
      - name: Restore NuGet packages (x64 Release)
        timeout-minutes: 35
        shell: pwsh
        run: |
          cd NanaZipSrc
          Write-Host "=== Restoring NuGet packages ==="
          MSBuild -restore -m NanaZip.slnx /p:Configuration=Release /p:Platform=x64
          Write-Host "=== Restore complete ==="

      # ------------------------------------------------------------------
      # Step 2: Inject Mica guard patch into NuGet cache.
      # Mile.Xaml NuGet package uses source injection: its .targets file
      # adds Source\Native\Mile.Xaml.cpp to the consuming project's
      # ClCompile list. We replace that file with the patched version
      # from the fork, so the Mica guard gets compiled into NanaZip.Modern.dll.
      # ------------------------------------------------------------------
      - name: Inject Mica guard patch into NuGet cache
        shell: pwsh
        run: |
          $nugetRoot = Join-Path $env:USERPROFILE ".nuget\packages\mile.xaml\2.5.1616"
          $targetFile = Join-Path $nugetRoot "Source\Native\Mile.Xaml.cpp"

          if (-not (Test-Path $nugetRoot)) {
            # Search for any version if exact version not found
            $mileXamlDir = Join-Path $env:USERPROFILE ".nuget\packages\mile.xaml"
            if (Test-Path $mileXamlDir) {
              $versions = Get-ChildItem $mileXamlDir -Directory
              Write-Host "Available Mile.Xaml versions: $($versions.Name -join ', ')"
              $nugetRoot = $versions[0].FullName
              $targetFile = Join-Path $nugetRoot "Source\Native\Mile.Xaml.cpp"
            } else {
              Write-Error "Mile.Xaml NuGet package not found in cache"
              exit 1
            }
          }

          Write-Host "NuGet cache path: $nugetRoot"
          Write-Host "Target file: $targetFile"

          if (-not (Test-Path $targetFile)) {
            Write-Error "Mile.Xaml.cpp not found in NuGet package"
            exit 1
          }

          # Backup original
          Copy-Item $targetFile "$targetFile.orig" -Force

          # Replace with patched version from fork
          $patchedFile = "MileXamlFork\Mile.Xaml.Native\Mile.Xaml.cpp"
          Copy-Item -Force $patchedFile $targetFile

          # Verify the patch is present
          $content = Get-Content $targetFile -Raw
          if ($content -match "WIN10 CRASH FIX") {
            Write-Host "=== Mica guard patch verified in NuGet cache ==="
          } else {
            Write-Error "Mica guard patch NOT found in replaced file!"
            exit 1
          }

      # ------------------------------------------------------------------
      # Step 3: Apply try/catch patch to App.cpp
      # Defense-in-depth: if CoreWindow::GetForCurrentThread() fails on
      # some Win10 configs, the try/catch prevents immediate crash.
      # ------------------------------------------------------------------
      - name: Apply try/catch patch to App.cpp
        shell: pwsh
        run: |
          $appCpp = "NanaZipSrc\NanaZip.Modern\App.cpp"
          $content = Get-Content $appCpp -Raw -Encoding UTF8

          if ($content -match "try\s*\{") {
            Write-Host "App.cpp already has try/catch patch, skipping"
            return
          }

          $old = 'winrt::check_hresult(::MileXamlGlobalInitialize());'
          $new = "          try`n          {`n              winrt::check_hresult(::MileXamlGlobalInitialize());`n          }`n          catch (winrt::hresult_error const&)`n          {`n              // Workaround for CoreWindow null on Win10 XAML Islands`n              // g_CoreWindowHandle is never read by NanaZip, safe to ignore`n          }"

          if ($content.Contains($old)) {
            $content = $content.Replace($old, $new)
            Set-Content -Path $appCpp -Value $content -Encoding UTF8 -NoNewline
            Write-Host "=== Applied try/catch patch to App.cpp ==="
          } else {
            Write-Host "WARNING: Could not find target line in App.cpp"
            Write-Host "Content preview:"
            Write-Host $content.Substring(0, [Math]::Min(500, $content.Length))
          }

      # ------------------------------------------------------------------
      # Step 4: Build NanaZip (x64 Release only, no arm64)
      # Build NanaZipPackage.wapproj which pulls in all project references.
      # The wapproj may fail at MSIX packaging step (signing etc.) but
      # individual binaries should already be built by then.
      # ------------------------------------------------------------------
      - name: Build NanaZip x64 Release
        id: build_wapproj
        timeout-minutes: 45
        shell: pwsh
        run: |
          cd NanaZipSrc
          Write-Host "=== Building NanaZipPackage.wapproj (x64 Release) ==="
          MSBuild -m NanaZipPackage/NanaZipPackage.wapproj /p:Configuration=Release /p:Platform=x64
        continue-on-error: true

      # Fallback: build individual projects if wapproj fails
      - name: Build individual projects (fallback)
        if: steps.build_wapproj.outcome == 'failure'
        timeout-minutes: 40
        shell: pwsh
        run: |
          cd NanaZipSrc
          Write-Host "=== Wapproj build failed, building individual projects ==="
          $projects = @(
            "K7Base\K7Base.vcxproj",
            "K7User\K7User.vcxproj",
            "NanaZip.Core\NanaZip.Core.vcxproj",
            "NanaZip.Codecs\NanaZip.Codecs.vcxproj",
            "NanaZip.Core\NanaZip.Core.Sfx.Console.vcxproj",
            "NanaZip.Core\NanaZip.Core.Sfx.Windows.vcxproj",
            "NanaZip.Modern\NanaZip.Modern.vcxproj",
            "NanaZip.UI.Modern\NanaZip.Modern.FileManager.vcxproj",
            "NanaZip.Universal\NanaZip.Universal.Console.vcxproj",
            "NanaZip.Universal\NanaZip.Universal.Windows.vcxproj"
          )
          foreach ($proj in $projects) {
            Write-Host "=== Building $proj ==="
            MSBuild -m $proj /p:Configuration=Release /p:Platform=x64
            if ($LASTEXITCODE -ne 0) {
              Write-Host "WARNING: $proj build failed (exit $LASTEXITCODE), continuing..."
            }
          }

      # ------------------------------------------------------------------
      # Step 5: Assemble portable package (x64 only)
      # ------------------------------------------------------------------
      - name: Assemble portable package
        shell: pwsh
        run: |
          $dest = "NanaZip_Portable_MicaGuard\x64"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          $outputRoot = "NanaZipSrc\Output\Binaries\Release"
          if (-not (Test-Path $outputRoot)) {
            # Try alternative output path
            $outputRoot = "NanaZipSrc\Output\Binaries"
          }
          Write-Host "=== Searching for built binaries under $outputRoot ==="
          Get-ChildItem -Path $outputRoot -Recurse -File | ForEach-Object { Write-Host "  $($_.FullName)" }

          $requiredFiles = @(
            "K7Base.dll",
            "K7User.dll",
            "NanaZip.Codecs.dll",
            "NanaZip.Core.dll",
            "NanaZip.Core.Console.sfx",
            "NanaZip.Core.Windows.sfx",
            "NanaZip.Modern.dll",
            "NanaZip.Modern.FileManager.exe",
            "NanaZip.Universal.Console.exe",
            "NanaZip.Universal.Windows.exe",
            "Mile.Xaml.Styles.SunValley.xbf",
            "resources.pri"
          )

          $foundCount = 0
          $missingCount = 0
          foreach ($f in $requiredFiles) {
            $found = Get-ChildItem -Path $outputRoot -Recurse -Filter $f -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) {
              Copy-Item -Force $found.FullName $dest
              Write-Host "OK: $f (from $($found.DirectoryName))"
              $foundCount++
            } else {
              Write-Host "MISSING: $f"
              $missingCount++
            }
          }

          # Copy ShellExtension if present
          $shellExt = Get-ChildItem -Path $outputRoot -Recurse -Filter "NanaZip.ShellExtension.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($shellExt) {
            Copy-Item -Force $shellExt.FullName $dest
            Write-Host "OK: NanaZip.ShellExtension.dll"
          }

          # Copy AppxManifest if present (needed for resources.pri resolution)
          $manifest = Get-ChildItem -Path $outputRoot -Recurse -Filter "AppxManifest.xml" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($manifest) {
            Copy-Item -Force $manifest.FullName $dest
            Write-Host "OK: AppxManifest.xml"
          }

          Write-Host ""
          Write-Host "=== Summary: $foundCount found, $missingCount missing ==="

          if ($missingCount -gt 0) {
            Write-Host "WARNING: Some files are missing. Check build output above."
          }

          # Critical files check
          $criticalFiles = @("NanaZip.Modern.dll", "NanaZip.Modern.FileManager.exe")
          foreach ($cf in $criticalFiles) {
            if (-not (Test-Path (Join-Path $dest $cf))) {
              Write-Error "CRITICAL: $cf not found! Build may have failed."
              exit 1
            }
          }

          Write-Host ""
          Write-Host "=== Final portable package contents ==="
          Get-ChildItem $dest | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NanaZip_Portable_MicaGuard
          path: NanaZip_Portable_MicaGuard
          if-no-files-found: error
          retention-days: 30

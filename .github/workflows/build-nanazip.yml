name: Build NanaZip Modern (Mica Guard) Portable x64

# Build NanaZip Modern with Mica guard patch for Win10 compatibility.
#
# Root cause: Mile.Xaml's WM_CREATE handler calls
# MileSetWindowSystemBackdropTypeAttribute(MICA) unconditionally.
# Mica is Win11-only; on Win10 it corrupts the XAML framework stack,
# causing white screen + delayed __fastfail 0xC0000409 crash.
#
# Fix: Guard the Mica call behind a Win11 version check (VerifyVersionInfoW).
# The patched Mile.Xaml.cpp source is in qyz3006/Mile.Xaml fork.
# Mile.Xaml NuGet package uses source injection (targets file adds
# Mile.Xaml.cpp to the consuming project's ClCompile list), so we
# replace the source file in the NuGet cache before building.
#
# Build strategy (v2): Per-project restore+build, NOT solution restore.
# The previous solution-level restore (MSBuild -restore NanaZip.slnx)
# hangs every time (>35min timeout, confirmed in Run #32).
# Per-project -restore only downloads what each vcxproj needs,
# avoiding the heavy MSIX/wapproj packages.

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build-nanazip.yml'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1

    steps:
      - name: Checkout this workflow repo
        uses: actions/checkout@v6

      - name: Clone NanaZip source (with submodules)
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 30
          git config --global https.lowSpeedLimit 1000
          git config --global https.lowSpeedTime 30
          timeout 600 git clone --depth 1 https://github.com/M2Team/NanaZip.git NanaZipSrc
          cd NanaZipSrc
          timeout 900 git submodule update --init --recursive --depth 1
          echo "=== NanaZipSrc top level ==="
          ls -la

      - name: Clone Mile.Xaml fork (Mica patch source)
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          timeout 300 git clone --depth 1 https://github.com/qyz3006/Mile.Xaml.git MileXamlFork
          echo "=== Mica patch verification ==="
          grep -c "WIN10 CRASH FIX" MileXamlFork/Mile.Xaml.Native/Mile.Xaml.cpp || { echo "ERROR: Mica patch not found in fork"; exit 1; }
          echo "Mica patch confirmed"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      # ------------------------------------------------------------------
      # Phase 1: Restore NanaZip.Modern packages only.
      # This downloads Mile.Xaml 2.5.1616 to the NuGet cache.
      # We restore NanaZip.Modern (not the solution) to avoid pulling
      # MSIX/wapproj packages that cause infinite hangs.
      # ------------------------------------------------------------------
      - name: Restore NanaZip.Modern packages
        timeout-minutes: 20
        shell: pwsh
        run: |
          cd NanaZipSrc
          Write-Host "=== Restoring NanaZip.Modern packages (x64 Release) ==="
          MSBuild -t:Restore -m NanaZip.Modern/NanaZip.Modern.vcxproj /p:Configuration=Release /p:Platform=x64
          Write-Host "=== Restore complete ==="
          # Verify Mile.Xaml is in cache
          $mileXamlDir = Join-Path $env:USERPROFILE ".nuget\packages\mile.xaml"
          if (Test-Path $mileXamlDir) {
            $versions = Get-ChildItem $mileXamlDir -Directory
            Write-Host "Mile.Xaml versions in cache: $($versions.Name -join ', ')"
          } else {
            Write-Error "Mile.Xaml NOT found in NuGet cache after restore!"
            exit 1
          }

      # ------------------------------------------------------------------
      # Phase 2: Inject Mica guard patch into NuGet cache.
      # Replace Source\Native\Mile.Xaml.cpp with patched version from fork.
      # ------------------------------------------------------------------
      - name: Inject Mica guard patch into NuGet cache
        shell: pwsh
        run: |
          $mileXamlDir = Join-Path $env:USERPROFILE ".nuget\packages\mile.xaml"
          $version = (Get-ChildItem $mileXamlDir -Directory | Select-Object -First 1).Name
          $targetFile = Join-Path $mileXamlDir "$version\Source\Native\Mile.Xaml.cpp"

          Write-Host "Target: $targetFile"

          if (-not (Test-Path $targetFile)) {
            Write-Error "Mile.Xaml.cpp not found in NuGet package"
            exit 1
          }

          # Backup original
          Copy-Item $targetFile "$targetFile.orig" -Force

          # Replace with patched version from fork
          $patchedFile = "MileXamlFork\Mile.Xaml.Native\Mile.Xaml.cpp"
          Copy-Item -Force $patchedFile $targetFile

          # Verify the patch is present
          $content = Get-Content $targetFile -Raw
          if ($content -match "WIN10 CRASH FIX") {
            Write-Host "=== Mica guard patch verified in NuGet cache ==="
          } else {
            Write-Error "Mica guard patch NOT found in replaced file!"
            exit 1
          }

      # ------------------------------------------------------------------
      # Phase 3: Apply try/catch patch to App.cpp
      # ------------------------------------------------------------------
      - name: Apply try/catch patch to App.cpp
        shell: pwsh
        run: |
          $appCpp = "NanaZipSrc\NanaZip.Modern\App.cpp"
          $content = Get-Content $appCpp -Raw -Encoding UTF8

          if ($content -match "try\s*\{") {
            Write-Host "App.cpp already has try/catch patch, skipping"
            return
          }

          $old = 'winrt::check_hresult(::MileXamlGlobalInitialize());'
          $new = "          try`n          {`n              winrt::check_hresult(::MileXamlGlobalInitialize());`n          }`n          catch (winrt::hresult_error const&)`n          {`n              // Workaround for CoreWindow null on Win10 XAML Islands`n              // g_CoreWindowHandle is never read by NanaZip, safe to ignore`n          }"

          if ($content.Contains($old)) {
            $content = $content.Replace($old, $new)
            Set-Content -Path $appCpp -Value $content -Encoding UTF8 -NoNewline
            Write-Host "=== Applied try/catch patch to App.cpp ==="
          } else {
            Write-Host "WARNING: Could not find target line in App.cpp"
          }

      # ------------------------------------------------------------------
      # Phase 4: Build all projects individually (x64 Release only).
      # Each project uses -restore to pull its own NuGet dependencies.
      # Build in dependency order. continue-on-error for non-critical
      # projects so we still get the core Modern binaries.
      # ------------------------------------------------------------------
      - name: Build K7Base
        timeout-minutes: 10
        shell: pwsh
        run: |
          cd NanaZipSrc
          MSBuild -restore -m K7Base/K7Base.vcxproj /p:Configuration=Release /p:Platform=x64

      - name: Build K7User
        timeout-minutes: 10
        shell: pwsh
        run: |
          cd NanaZipSrc
          MSBuild -restore -m K7User/K7User.vcxproj /p:Configuration=Release /p:Platform=x64

      - name: Build NanaZip.Core
        timeout-minutes: 10
        shell: pwsh
        run: |
          cd NanaZipSrc
          MSBuild -restore -m NanaZip.Core/NanaZip.Core.vcxproj /p:Configuration=Release /p:Platform=x64

      - name: Build NanaZip.Codecs
        timeout-minutes: 10
        shell: pwsh
        run: |
          cd NanaZipSrc
          MSBuild -restore -m NanaZip.Codecs/NanaZip.Codecs.vcxproj /p:Configuration=Release /p:Platform=x64

      - name: Build NanaZip.Core.Sfx.Console
        timeout-minutes: 10
        shell: pwsh
        run: |
          cd NanaZipSrc
          MSBuild -restore -m NanaZip.Core/NanaZip.Core.Sfx.Console.vcxproj /p:Configuration=Release /p:Platform=x64

      - name: Build NanaZip.Core.Sfx.Windows
        timeout-minutes: 10
        shell: pwsh
        run: |
          cd NanaZipSrc
          MSBuild -restore -m NanaZip.Core/NanaZip.Core.Sfx.Windows.vcxproj /p:Configuration=Release /p:Platform=x64

      - name: Build NanaZip.Modern (with Mica guard)
        timeout-minutes: 15
        shell: pwsh
        run: |
          cd NanaZipSrc
          Write-Host "=== Building NanaZip.Modern (Mica guard patched source) ==="
          MSBuild -restore -m NanaZip.Modern/NanaZip.Modern.vcxproj /p:Configuration=Release /p:Platform=x64

      - name: Build NanaZip.Modern.FileManager
        timeout-minutes: 20
        shell: pwsh
        run: |
          cd NanaZipSrc
          Write-Host "=== Building NanaZip.Modern.FileManager ==="
          MSBuild -restore -m NanaZip.UI.Modern/NanaZip.Modern.FileManager.vcxproj /p:Configuration=Release /p:Platform=x64

      - name: Build NanaZip.Universal.Console
        timeout-minutes: 10
        shell: pwsh
        continue-on-error: true
        run: |
          cd NanaZipSrc
          MSBuild -restore -m NanaZip.Universal/NanaZip.Universal.Console.vcxproj /p:Configuration=Release /p:Platform=x64

      - name: Build NanaZip.Universal.Windows
        timeout-minutes: 10
        shell: pwsh
        continue-on-error: true
        run: |
          cd NanaZipSrc
          MSBuild -restore -m NanaZip.Universal/NanaZip.Universal.Windows.vcxproj /p:Configuration=Release /p:Platform=x64

      # ------------------------------------------------------------------
      # Phase 5: Assemble portable package (x64 only)
      # ------------------------------------------------------------------
      - name: Assemble portable package
        shell: pwsh
        run: |
          $dest = "NanaZip_Portable_MicaGuard\x64"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          $outputRoot = "NanaZipSrc\Output\Binaries\Release"
          if (-not (Test-Path $outputRoot)) {
            $outputRoot = "NanaZipSrc\Output\Binaries"
          }
          Write-Host "=== Searching for built binaries under $outputRoot ==="
          Get-ChildItem -Path $outputRoot -Recurse -File | ForEach-Object { Write-Host "  $($_.FullName)" }

          $requiredFiles = @(
            "K7Base.dll",
            "K7User.dll",
            "NanaZip.Codecs.dll",
            "NanaZip.Core.dll",
            "NanaZip.Core.Console.sfx",
            "NanaZip.Core.Windows.sfx",
            "NanaZip.Modern.dll",
            "NanaZip.Modern.FileManager.exe",
            "NanaZip.Universal.Console.exe",
            "NanaZip.Universal.Windows.exe",
            "Mile.Xaml.Styles.SunValley.xbf",
            "resources.pri"
          )

          $foundCount = 0
          $missingCount = 0
          foreach ($f in $requiredFiles) {
            $found = Get-ChildItem -Path $outputRoot -Recurse -Filter $f -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) {
              Copy-Item -Force $found.FullName $dest
              Write-Host "OK: $f (from $($found.DirectoryName))"
              $foundCount++
            } else {
              Write-Host "MISSING: $f"
              $missingCount++
            }
          }

          Write-Host ""
          Write-Host "=== Summary: $foundCount found, $missingCount missing ==="

          # Critical files check
          $criticalFiles = @("NanaZip.Modern.dll", "NanaZip.Modern.FileManager.exe")
          foreach ($cf in $criticalFiles) {
            if (-not (Test-Path (Join-Path $dest $cf))) {
              Write-Error "CRITICAL: $cf not found! Build may have failed."
              exit 1
            }
          }

          Write-Host ""
          Write-Host "=== Final portable package contents ==="
          Get-ChildItem $dest | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NanaZip_Portable_MicaGuard
          path: NanaZip_Portable_MicaGuard
          if-no-files-found: error
          retention-days: 30

name: Build NanaZip Classic (pure-Win32) Portable

# 目标：在 GitHub 在线 Action 上编译 NanaZip 的 **Classic 纯 Win32 文件管理器**
#       （NanaZip.UI.Classic），产出未签名的便携 NanaZip.exe，供本地直接在
#       Windows 10 上运行。
#
# 为什么只编 Classic（γ 收敛，2026-08-24）：
#   NanaZip Modern (WinUI3/XAML Islands) 在 Win10 上整体不兼容（issue #400 家族：
#   twinapi.appcore.dll / XAML 框架 init 不完整 -> 白屏、卡死、__fastfail 0xC0000409）。
#   代码级补丁（Mica guard）只能延后崩溃，救不了渲染。而 Classic 是纯 Win32、
#   零 XAML / 零 WinAppSDK 依赖，Win10 稳定。用户最终只需 x64\NanaZip.exe。
#
# 为什么放弃 BuildAllTargets.proj（2026-08-24 实证）：
#   原先整个方案走 BuildAllTargets.proj，其 Restore 阶段要还原整个 NanaZip.slnx，
#   含 WinAppSDK / Mile.Xaml 2.5.1616 等数十个来自 nuget.org 的大包。在 GitHub
#   Windows runner 上该 Restore 反复无限挂起（观测：4 个 run 全部卡在 Restore 步骤
#   in_progress 数小时，加 18min 硬超时后 fail）。而 Classic 项目只依赖 2 个小包
#   （Mile.Windows.Helpers / Mile.Windows.UniCrt，同作者、体积小）。因此本版
#   **完全跳过 Modern 还原/构建链**，仅 restore+build Classic，根除了 restore 卡点。
#
# 健壮性（沿用 2026-08-24）：clone/submodule 均包 timeout，防无限挂起；
# 所有长步骤加 timeout-minutes。

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build-nanazip.yml'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1
    steps:
      - name: Checkout this workflow repo (shallow)
        uses: actions/checkout@v6

      - name: Clone NanaZip source (robust, timeout-guarded)
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 30
          git config --global https.lowSpeedLimit 1000
          git config --global https.lowSpeedTime 30
          timeout 600 git clone --depth 1 https://github.com/M2Team/NanaZip.git NanaZipSrc
          cd NanaZipSrc
          timeout 900 git submodule update --init --recursive --depth 1
          echo "=== NanaZipSrc top level ==="
          ls -la

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      # ------------------------------------------------------------------
      # 仅还原 + 构建 Classic（纯 Win32）。只拉 2 个 Mile 小包，避免 Modern
      # 链（WinAppSDK/Mile.Xaml 等数十个大包）在 runner 上无限挂起。
      # ------------------------------------------------------------------
      - name: Build Classic x64 (pure-Win32, Win10-stable)
        timeout-minutes: 40
        run: |
          cd NanaZipSrc
          MSBuild -restore -m NanaZip.UI.Classic/NanaZip.vcxproj /p:Platform=x64 /p:Configuration=Release

      - name: Build Classic arm64 (pure-Win32, Win10-stable)
        timeout-minutes: 40
        run: |
          cd NanaZipSrc
          MSBuild -restore -m NanaZip.UI.Classic/NanaZip.vcxproj /p:Platform=arm64 /p:Configuration=Release

      - name: Locate and include Classic NanaZip.exe in portable layout
        timeout-minutes: 10
        shell: pwsh
        run: |
          $root = "NanaZipSrc\Output\Binaries"
          $destX64 = Join-Path $root "Root\Binaries\x64"
          $destARM64 = Join-Path $root "Root\Binaries\arm64"

          $classicExes = Get-ChildItem -Path $root -Recurse -Filter "NanaZip.exe" -ErrorAction SilentlyContinue
          if ($classicExes.Count -eq 0) {
            Write-Error "Classic NanaZip.exe NOT FOUND after build."
            exit 1
          }
          Write-Host "Found $($classicExes.Count) Classic exe(s):"
          $classicExes | ForEach-Object { Write-Host "  $($_.FullName)" }

          foreach ($ce in $classicExes) {
            $arch = Split-Path (Split-Path $ce.FullName -Parent) -Leaf
            if ($arch -eq "x64") { $dest = $destX64 }
            elseif ($arch -eq "arm64") { $dest = $destARM64 }
            else { Write-Warning "Unknown arch '$arch' for $($ce.FullName), default x64"; $dest = $destX64 }
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Copy-Item -Force $ce.FullName $dest
            Write-Host "Copied Classic NanaZip.exe -> $dest"
          }

      - name: Upload Portable Binaries (unsigned, run locally on Win10)
        uses: actions/upload-artifact@v7
        with:
          name: NanaZip_Classic_Portable
          path: NanaZipSrc/Output/Binaries/Root/Binaries
